name: News Agent Tests

on:
  push:
    paths:
      - "news_agent/**"
      - "scripts/generate_sentence.py"
      - "prompts/llm/positive.txt"
      - "tests/test_news_agent.py"
      - "tests/test_validation.py"
      - ".github/workflows/news-agent-tests.yml"
  pull_request:
    paths:
      - "news_agent/**"
      - "scripts/generate_sentence.py"
      - "prompts/llm/positive.txt"
      - "tests/test_news_agent.py"
      - "tests/test_validation.py"
      - ".github/workflows/news-agent-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install pytest requests python-dotenv
      - name: Run offline news-agent tests
        run: python -m pytest -q tests/test_news_agent.py tests/test_validation.py
