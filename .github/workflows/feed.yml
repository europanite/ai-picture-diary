name: Feed

# Scheduled runs use the default branch. Times are UTC: 03:17 = 12:17 JST.
# Avoid :00 because GitHub reports increased schedule delays at the hour.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      illustrate:
        description: 'Generate an illustration for the diary (default: on)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      slot:
        description: 'Kept for compatibility with existing callers; only event is supported'
        required: false
        type: string
        default: 'event'
      illustrate:
        description: 'Generate an illustration for the diary'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

# Serialize this with the older manually triggered Feed Event workflow.
concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  news-diary:
    if: ${{ inputs.slot == '' || inputs.slot == 'event' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      LOCAL_UID: '1001'
      LOCAL_GID: '1001'
      NEWS_OLLAMA_MODEL: qwen2.5:3b-instruct
      NEWS_MAX_RETRIES: '5'
      NEWS_REQUEST_TIMEOUT: '300'
      # Scheduled illustration is enabled by default. Set NEWS_IMAGE_ENABLED=false to disable.
      SCHEDULED_IMAGE_ENABLED: ${{ vars.NEWS_IMAGE_ENABLED != 'false' }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Docker Compose and disk
        run: |
          set -euo pipefail
          docker compose version
          df -h .

      - name: Build news agent (CPU-only Python dependencies)
        run: docker compose -f docker-compose.news.yml build news-agent

      - name: Start Ollama and download the text model
        run: |
          set -euo pipefail
          docker compose -f docker-compose.news.yml up -d --wait ollama
          docker compose -f docker-compose.news.yml exec -T ollama \
            ollama pull "$NEWS_OLLAMA_MODEL"

      - name: Collect fresh English news and select three keywords
        env:
          NEWS_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.news.yml run --rm \
            --entrypoint python news-agent -m news_agent.cli \
            --config news_agent/sources.json \
            --output data/news/selection.json \
            --mode balanced --seed "$NEWS_SEED"
          test -s data/news/selection.json

      - name: Generate validated English diary with Ollama
        run: |
          set -euo pipefail
          docker compose -f docker-compose.news.yml run --rm diary-writer
          test -s data/news/draft.json

      - name: Publish news diary and rebuild feed pages
        run: |
          set -euo pipefail
          docker compose -f docker-compose.news.yml run --rm diary-publish
          test -s frontend/app/public/latest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path('frontend/app/public/feed/index.json').read_text())
          items = index.get('items', [])
          assert items and items[0]['kind'] == 'news_diary', 'Latest entry is not a news diary'
          assert len(items[0]['source_articles']) == 3, 'Missing news provenance'
          print('Validated published English news diary:', items[0]['id'])
          PY

      # CPU image generation can be slow or run out of memory; use a smaller model on CI.
      # An image failure will not discard a validated diary; logs will show the failure.
      - name: Illustrate newest diary entry (CPU, best effort)
        if: ${{ (github.event_name == 'schedule' && env.SCHEDULED_IMAGE_ENABLED == 'true') || inputs.illustrate == true }}
        id: illustration
        timeout-minutes: 30
        continue-on-error: true
        env:
          PATCH_JSON: '1'
          SEED_OFFSET: ${{ github.run_number }}
          SDXL_MODEL_ID: stabilityai/sd-turbo
          STEPS: '1'
          GUIDANCE_SCALE: '0.0'
        run: |
          set -euo pipefail
          docker compose -f docker-compose.news.yml --profile illustration \
            run --rm --build diary-illustrate
          python3 - <<'PY'
          import json
          from pathlib import Path

          public = Path('frontend/app/public')
          latest = json.loads((public / 'feed/page_000.json').read_text())['items'][0]
          image = public / 'image' / (latest['id'] + '.png')
          snapshot = json.loads((public / 'feed' / (latest['id'] + '.json')).read_text())['items'][0]
          assert image.is_file() and image.stat().st_size > 0, f'Image not generated: {image}'
          assert snapshot.get('image'), 'Image not linked in feed snapshot'
          print('Illustrated:', latest['id'], image)
          PY

      - name: Rebuild pages after optional illustration
        run: |
          set -euo pipefail
          docker compose -f docker-compose.news.yml run --rm diary-index

      - name: Commit generated public assets to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- frontend/app/public/latest.json frontend/app/public/feed
          for asset_dir in posts image snapshot; do
            if test -d "frontend/app/public/$asset_dir"; then
              git add -A -- "frontend/app/public/$asset_dir"
            fi
          done
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No public changes to commit.'
            exit 0
          fi
          git commit -m 'chore: publish news-driven AI picture diary'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Print illustration result
        if: always()
        run: |
          echo 'Illustration outcome: ${{ steps.illustration.outcome }}'
          echo 'A failed optional illustration does not invalidate the news diary.'

      - name: Stop Ollama
        if: always()
        run: docker compose -f docker-compose.news.yml down || true

  pages:
    needs: news-diary
    if: needs.news-diary.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    secrets: inherit
