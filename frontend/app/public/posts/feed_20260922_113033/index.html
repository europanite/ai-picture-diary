  <title>うんこは健康にとって有害です。
Study point: The grammar pattern 〜にとって有害です (isanai desu) 表現し、何かの目的や結果に対する否定的な影響を強調します。例えば、うんこが健康にとって有害です。(N2 level grammar)。この表現は英語で &#x27;be harmful to&#x27; と翻訳できます。英語例: The poop is harmful to health.
English translation: The poop is harmful to health.</title>
