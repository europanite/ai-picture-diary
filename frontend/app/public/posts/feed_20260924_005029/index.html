  <title>うんこを排泄するのは人間だけではありません。
Study point: The grammar pattern 〜が〜だけではありません。 expresses that something is not the only one who can do something, but others can also do it.
English translation: Not only humans but also other creatures can excrete poop.</title>
</head>
<body>
  <main>
    <p>うんこを排泄するのは人間だけではありません。
Study point: The grammar pattern 〜が〜だけではありません。 expresses that something is not the only one who can do something, but others can also do it.
English translation: Not only humans but also other creatures can excrete poop.</p>
  </main>
</body>
