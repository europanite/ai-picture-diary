  <title>うんこを嫌うのは、うんこを嫌う人だけです。
Study point: The grammar pattern 〜ないのは、〜ない人だけです。 expresses that something is only true for a particular group of people.
English translation: The only people who don&#x27;t like poop are the people who don&#x27;t like poop.</title>
</head>
<body>
  <main>
    <p>うんこを嫌うのは、うんこを嫌う人だけです。
Study point: The grammar pattern 〜ないのは、〜ない人だけです。 expresses that something is only true for a particular group of people.
English translation: The only people who don&#x27;t like poop are the people who don&#x27;t like poop.</p>
  </main>
</body>
