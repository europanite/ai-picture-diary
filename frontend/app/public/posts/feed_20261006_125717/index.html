  <title>うんこが降ってきても、彼はそれを気にしない。
Study point: The grammar pattern 〜てしまう is used when expressing an outcome that is not necessarily a negative consequence, but it is a very likely result given a certain situation.
English translation: Even if poop rains, he doesn&#x27;t care.</title>
</head>
<body>
  <main>
    <p>うんこが降ってきても、彼はそれを気にしない。
Study point: The grammar pattern 〜てしまう is used when expressing an outcome that is not necessarily a negative consequence, but it is a very likely result given a certain situation.
English translation: Even if poop rains, he doesn&#x27;t care.</p>
  </main>
</body>
