  <title>うんこを蹴っても、畑は fertilizer に変わりない。
Study point: The grammar pattern 〜てしまう which means &#x27;to end up doing something&#x27; or &#x27;to result in something&#x27;.
English translation: I kicked the poop, but the field didn&#x27;t change into fertilizer.</title>

  <main>
    <p>うんこを蹴っても、畑は fertilizer に変わりない。
Study point: The grammar pattern 〜てしまう which means &#x27;to end up doing something&#x27; or &#x27;to result in something&#x27;.
English translation: I kicked the poop, but the field didn&#x27;t change into fertilizer.</p>
  </main>
</body>
