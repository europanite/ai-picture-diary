<!doctype html>

<head>

  <title>お腹が空いたので、うんこを食べてしまった。
Study point: The grammar pattern 〜ているうちに is used to express an action that is happening at the same time as another action.
English translation: While I was hungry, I ate poop.</title>
</head>
<body>
  <main>
    <p>お腹が空いたので、うんこを食べてしまった。
Study point: The grammar pattern 〜ているうちに is used to express an action that is happening at the same time as another action.
English translation: While I was hungry, I ate poop.</p>
  </main>
</body>
</html>
